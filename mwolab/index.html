<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>

    <link rel="canonical" href="https://kmonkeyhead.github.io/mwolab/">

    <meta http-equiv="refresh"
          content="0; url=https://kmonkeyhead.github.io/mwolab/">

    <script>
        window.location.replace(
            "https://kmonkeyhead.github.io/mwolab/" +
            window.location.search +
            window.location.hash
        );
    </script>
</head>
<body>
    <p>
        Redirecting to
        <a href="https://kmonkeyhead.github.io/mwolab/">
            https://kmonkeyhead.github.io/mwolab/
        </a>
    </p>
</body>
</html>
